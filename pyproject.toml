[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen-nsfw-pose-telegram-bot"
version = "0.1.0"
description = "Telegram bot for Qwen-Image 2.1 NSFW pose generation via ComfyUI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Community Contributors" }]
keywords = ["qwen", "comfyui", "telegram-bot", "nsfw", "pose", "ai-art"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-telegram-bot>=20.7",
    "aiohttp>=3.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
]

[project.scripts]
qwen-pose-bot = "qwen_nsfw_pose_tg_bot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_nsfw_pose_tg_bot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
